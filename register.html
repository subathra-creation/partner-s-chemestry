
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#190f1c">

  <title>Register | Suba Creation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #190f1c;
      color: #fff0f6;
      font-family: "DM Sans", sans-serif;
    }

    .register-container {
      width: 100%;
      max-width: 480px;
      padding: 34px 26px;
      text-align: center;
      border: 1px solid #553449;
      border-radius: 26px;
      background: linear-gradient(145deg, #2b1b2b, #211522);
      box-shadow: 0 20px 60px #0005;
    }

    .heart {
      color: #f3a8c4;
      font-size: 42px;
      margin-bottom: 8px;
    }

    .brand {
      margin: 0;
      color: #f3b4cb;
      letter-spacing: 3px;
      font-size: 13px;
      text-transform: uppercase;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(28px, 7vw, 38px);
      margin: 18px 0 10px;
    }

    .subtitle {
      color: #d6b9ca;
      line-height: 1.7;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .person-card {
      padding: 18px;
      margin: 14px 0;
      text-align: left;
      border: 1px solid #624054;
      border-radius: 16px;
      background: #190f1c;
    }

    .person-label {
      margin: 0 0 8px;
      color: #e8a9c3;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .person-name {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: 20px;
      font-weight: 600;
    }

    .note {
      color: #d6b9ca;
      font-size: 12px;
      line-height: 1.6;
      margin: 22px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(100deg, #f2c6d7, #d98baa);
      color: #281523;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #e9b8cd;
      font-size: 13px;
      text-decoration: none;
    }

    .message {
      color: #ffb8ca;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="register-container">
    <div class="heart">♡</div>

    <p class="brand">Suba Creation</p>

    <h1>Ready for Your Journey?</h1>

    <p class="subtitle">
      Two hearts, two names, one beautiful journey. ❤️
      <br>Confirm your details before starting.
    </p>

    <section class="person-card">
      <p class="person-label">FIRST PERSON</p>
      <p class="person-name" id="yourName">Loading...</p>
    </section>

    <section class="person-card">
      <p class="person-label">PARTNER</p>
      <p class="person-name" id="partnerName">Waiting for partner...</p>
    </section>

    <p class="note" id="roomInfo"></p>

    <p class="message" id="statusMessage" role="status"></p>

    <button type="button" id="continueBtn">
      Continue to Level 1 ♡
    </button>

    <a class="back-link" href="index.html">← Back to Connect</a>
  </main>

  <script>
    const yourName = sessionStorage.getItem("yourName");
    const roomCode = sessionStorage.getItem("roomCode");
    const roomRole = sessionStorage.getItem("roomRole");

    const yourNameElement = document.getElementById("yourName");
    const partnerNameElement = document.getElementById("partnerName");
    const roomInfo = document.getElementById("roomInfo");
    const statusMessage = document.getElementById("statusMessage");
    const continueBtn = document.getElementById("continueBtn");

    if (!yourName || !roomCode) {
      statusMessage.textContent =
        "Please return to the home page and create or join a room first.";
      continueBtn.disabled = true;
      continueBtn.style.opacity = "0.5";
    } else {
      yourNameElement.textContent = yourName;
      roomInfo.textContent = "Room code: " + roomCode;

      if (roomRole === "host") {
        partnerNameElement.textContent = "Waiting for your partner to join";
      } else {
        partnerNameElement.textContent =
          "Your partner's name will appear when the room is connected.";
      }
    }

    continueBtn.addEventListener("click", () => {
      if (!yourName || !roomCode) {
        window.location.href = "index.html";
        return;
      }

      window.location.href = "level1.html";
    });
  </script>
</body>
</html>

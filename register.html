
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Your Partner | Suba Creation</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      margin: auto;
      padding: 24px 20px;
    }

    .room-section {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .room-section h2 {
      text-align: center;
      font-size: 22px;
      margin: 5px 0;
    }

    .connect-text {
      text-align: center;
      line-height: 1.6;
      font-size: 14px;
      margin: 0 0 8px;
    }

    .room-section label {
      font-size: 14px;
      text-align: left;
    }

    .room-section input {
      width: 100%;
      min-height: 44px;
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
    }

    #roomCode {
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    #connectBtn {
      width: 100%;
      min-height: 46px;
      margin-top: 5px;
      cursor: pointer;
    }

    #connectBtn:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #roomMessage {
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
      font-size: 14px;
      margin: 4px 0;
    }

    #createdCode {
      font-size: 27px;
      letter-spacing: 5px;
      font-weight: bold;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .footer { margin-top: 14px; }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .card { padding: 22px 17px; }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="heart">♡</div>
    <p class="small-title">WELCOME TO</p>
    <h1>Suba Creation</h1>
    <p class="subtitle">A Journey For Two ❤️</p>

    <div class="room-section">
      <h2>💗 Connect Your Partner</h2>

      <p class="connect-text">
        Two hearts, two phones, one beautiful journey.
        Create a room or enter your partner's code to join.
      </p>

      <label for="playerName">Your Name</label>
      <input id="playerName" type="text"
        placeholder="Enter your name" maxlength="40">

      <label for="roomCode">Partner Connection Code</label>
      <input id="roomCode" type="text"
        placeholder="Leave empty to create a room"
        maxlength="6" autocomplete="off">

      <button type="button" id="connectBtn">
        Connect Your Partner ♡
      </button>

      <p id="roomMessage" role="status" aria-live="polite"></p>
      <div id="createdCode"></div>
    </div>

    <p class="footer">Two Hearts. One Beautiful Journey. 💗</p>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    import {
      getDatabase,
      ref,
      get,
      set,
      update,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD60gF88SJDOSopSox5mNVvmdOiy9aMKCg",
      authDomain: "partner-s-chemestry.firebaseapp.com",
      databaseURL: "https://partner-s-chemestry-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "partner-s-chemestry",
      storageBucket: "partner-s-chemestry.firebasestorage.app",
      messagingSenderId: "372815828546",
      appId: "1:372815828546:web:67f014e84b054d5a5cbfdb",
      measurementId: "G-KMQBJRNTPQ"
    };

    const nameInput = document.getElementById("playerName");
    const codeInput = document.getElementById("roomCode");
    const connectBtn = document.getElementById("connectBtn");
    const message = document.getElementById("roomMessage");
    const createdCode = document.getElementById("createdCode");

    let app;
    let auth;
    let database;
    let stopListening = null;
    let navigationStarted = false;
    let currentRoomCode = null;

    function showMessage(text) {
      message.textContent = text;
    }

    function generateRoomCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";

      for (let i = 0; i < 6; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
      }

      return code;
    }

    function goToLevelOne(roomCode, players) {
      if (navigationStarted || players.length < 2) return;

      navigationStarted = true;
      showMessage("💕 Both connected! Opening Level 1...");

      const params = new URLSearchParams({
        room: roomCode,
        name1: players[0].name || "Player 1",
        name2: players[1].name || "Player 2"
      });

      window.location.assign("./level1.html?" + params.toString());
    }

    async function createRoom(user, playerName) {
      let roomCode = "";
      let roomRef = null;

      for (let attempt = 0; attempt < 10; attempt++) {
        const candidate = generateRoomCode();
        const candidateRef = ref(database, "rooms/" + candidate);
        const snapshot = await get(candidateRef);

        if (!snapshot.exists()) {
          roomCode = candidate;
          roomRef = candidateRef;
          break;
        }
      }

      if (!roomCode) {
        throw new Error("Could not create a room. Please try again.");
      }

      await set(roomRef, {
        players: {
          [user.uid]: {
            name: playerName,
            joinedAt: Date.now()
          }
        },
        status: "waiting",
        createdAt: Date.now()
      });

      codeInput.value = roomCode;
      createdCode.textContent = roomCode;
      showMessage("Room created! Share this code with your partner 💗");

      watchRoom(roomCode);
    }

    async function joinRoom(user, playerName, roomCode) {
      const roomRef = ref(database, "rooms/" + roomCode);
      const snapshot = await get(roomRef);

      if (!snapshot.exists()) {
        throw new Error("Room not found. Check the code.");
      }

      const room = snapshot.val();
      const players = room.players || {};
      const playerIds = Object.keys(players);

      if (players[user.uid]) {
        watchRoom(roomCode);
        return;
      }

      if (playerIds.length >= 2) {
        throw new Error("This room already has two players.");
      }

      await update(roomRef, {
        ["players/" + user.uid]: {
          name: playerName,
          joinedAt: Date.now()
        },
        status: "ready"
      });

      createdCode.textContent = roomCode;
      showMessage("Partner joined! Opening the game when both are ready 💗");

      watchRoom(roomCode);
    }

    function watchRoom(roomCode) {
      if (currentRoomCode === roomCode && stopListening) return;

      if (stopListening) {
        stopListening();
      }

      currentRoomCode = roomCode;
      const roomRef = ref(database, "rooms/" + roomCode);

      stopListening = onValue(
        roomRef,
        (snapshot) => {
          if (!snapshot.exists()) {
            showMessage("Room not found. Please create a new room.");
            return;
          }

          const room = snapshot.val();

          const players = Object.entries(room.players || {})
            .map(([uid, player]) => ({ ...player, uid }))
            .sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));

          createdCode.textContent = roomCode;

          if (players.length < 2) {
            showMessage("Waiting for your partner 💗 Share code: " + roomCode);
            return;
          }

          goToLevelOne(roomCode, players);
        },
        (error) => {
          console.error("Firebase listener error:", error);
          showMessage("Database error: " + error.message);
        }
      );
    }

    async function connectPartner() {
      if (connectBtn.disabled) return;

      const playerName = nameInput.value.trim();
      const roomCode = codeInput.value.trim().toUpperCase();

      if (!playerName) {
        showMessage("Please enter your name first 💗");
        nameInput.focus();
        return;
      }

      if (roomCode && !/^[A-Z0-9]{6}$/.test(roomCode)) {
        showMessage("Enter a valid 6-character room code.");
        codeInput.focus();
        return;
      }

      connectBtn.disabled = true;
      connectBtn.textContent = "Connecting...";
      showMessage("Connecting to Firebase... 💗");

      try {
        if (!app) {
          app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          database = getDatabase(app);
        }

        const credentials = await signInAnonymously(auth);

        if (roomCode) {
          await joinRoom(credentials.user, playerName, roomCode);
        } else {
          await createRoom(credentials.user, playerName);
        }
      } catch (error) {
        console.error(error);
        showMessage("Connection failed: " + error.message);
      } finally {
        connectBtn.disabled = false;
        connectBtn.textContent = "Connect Your Partner ♡";
      }
    }

    connectBtn.addEventListener("click", connectPartner);
  </script>
</body>
</html>

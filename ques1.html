
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#190f1c">
  <title>Level 1 | Suba Creation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #190f1c;
      --card: #2b1b2b;
      --pink: #f3a5c5;
      --pink-light: #ffd6e6;
      --text: #fff6f5;
      --muted: #c7b5c5;
      --border: rgba(243, 165, 197, 0.23);
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 15px 40px;
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, #67325255, transparent 35%),
        radial-gradient(circle at 90% 80%, #623d6650, transparent 35%),
        var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 26px;
    }

    .small {
      color: var(--pink);
      letter-spacing: 3px;
      font-size: 11px;
      font-weight: 700;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(30px, 7vw, 43px);
      font-weight: 500;
      margin: 13px 0;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .card {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--border);
      border-radius: 19px;
      padding: 21px;
      margin-bottom: 17px;
      box-shadow: 0 12px 35px #00000018;
    }

    h2 {
      font-family: "Playfair Display", serif;
      font-size: 22px;
      font-weight: 500;
      margin-top: 0;
    }

    .status {
      color: var(--pink-light);
      text-align: center;
      line-height: 1.7;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .timer {
      text-align: center;
      font-size: 23px;
      font-weight: 700;
      color: var(--pink);
      margin-top: 12px;
    }

    .progress {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 20px 0;
    }

    .question-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 19px;
      margin-bottom: 15px;
    }

    .question-card h2 {
      font-size: 19px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px;
      margin: 9px 0;
      border: 1px solid #ffffff20;
      border-radius: 12px;
      cursor: pointer;
      background: #ffffff05;
      transition: 0.2s;
    }

    .option:has(input:checked) {
      border-color: var(--pink);
      background: #e879a920;
    }

    .option input {
      accent-color: #ed91c5;
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .option span {
      font-size: 14px;
      line-height: 1.5;
    }

    .main-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: none;
      border-radius: 12px;
      color: #291522;
      background: linear-gradient(120deg, #ffd6e6, #ed9fc1);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .main-btn:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .main-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .footer {
      text-align: center;
      color: #a991a6;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 30px;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px 30px;
      }

      .card {
        padding: 17px;
      }

      .question-card {
        padding: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div class="small">♡ SUBA CREATION ❤️</div>
      <h1>A Journey For Two</h1>
      <div class="subtitle">Level 1 · Do You Really Know Me?</div>
    </header>

    <section class="card">
      <h2 id="phaseTitle">Welcome 💗</h2>
      <p class="subtitle" id="instructions">
        Choose your favourite answers and discover each other.
      </p>
      <p class="status" id="status">Connecting...</p>
      <div class="timer" id="timer"></div>
    </section>

    <section id="gameArea" class="hidden">
      <p class="progress" id="progress"></p>

      <form id="answerForm">
        <div id="questions"></div>
        <button type="submit" id="submitBtn" class="main-btn">
          Submit Answers ❤️
        </button>
      </form>
    </section>

    <section id="result" class="card hidden">
      <h2>Our Level 1 Result 💕</h2>
      <p id="scoreText"></p>
      <p class="subtitle" id="resultDetails"></p>
      <button type="button" class="main-btn"
        onclick="location.href='level2.html'">
        Next Level →
      </button>
    </section>

    <footer class="footer">MADE WITH LOVE · SUBA CREATION</footer>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD60gF88SJDOSopSox5mNVvmdOiy9aMKCg",
      authDomain: "partner-s-chemestry.firebaseapp.com",
      databaseURL: "https://partner-s-chemestry-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "partner-s-chemestry",
      storageBucket: "partner-s-chemestry.firebasestorage.app",
      messagingSenderId: "372815828546",
      appId: "1:372815828546:web:67f014e84b054d5a5cbfdb",
      measurementId: "G-KMQBJRNTPQ"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.database();

    const questions = [
      {
        q: "What is my favourite food?",
        options: ["Biryani", "Dosa", "Pizza", "Fried Rice"]
      },
      {
        q: "What is my favourite colour?",
        options: ["Black", "Blue", "Pink", "Purple"]
      },
      {
        q: "How do I love spending my free time?",
        options: ["Listening to music", "Watching movies", "Sleeping", "Talking with my partner"]
      },
      {
        q: "What makes me the happiest?",
        options: ["Getting gifts", "Time with loved ones", "Going out", "Getting praised"]
      },
      {
        q: "What is my dream destination?",
        options: ["Beach", "Hill station", "Bangalore", "Abroad"]
      },
      {
        q: "What gift do I love most?",
        options: ["Flowers", "Chocolates", "Teddy bear", "Handwritten letter"]
      },
      {
        q: "What do I usually do when I feel sad?",
        options: ["Stay quiet", "Cry", "Listen to music", "Talk to someone I trust"]
      },
      {
        q: "What matters most to me in a relationship?",
        options: ["Trust", "Love and care", "Time together", "Honesty"]
      },
      {
        q: "What is my favourite type of date?",
        options: ["Beach walk", "Dinner together", "Watching a movie", "A long conversation"]
      },
      {
        q: "What is my biggest dream?",
        options: ["Successful career", "Happy family", "Travel the world", "Peaceful, happy life"]
      }
    ];

    const roomCode = sessionStorage.getItem("roomCode");
    const role = sessionStorage.getItem("roomRole");
    const myName = sessionStorage.getItem("yourName") || "Player";

    const $ = id => document.getElementById(id);

    let roomRef;
    let levelRef;
    let partnerRole;
    let partnerName = "your partner";
    let roomData = null;
    let mode = "own";
    let selectedAnswers = {};
    let submitted = false;
    let countdownHandle = null;
    let timerStartedAt = null;

    function showStatus(message) {
      $("status").textContent = message;
    }

    function renderQuestions() {
      $("questions").innerHTML = "";

      $("phaseTitle").textContent =
        mode === "own"
          ? "Choose Your Favourites 💗"
          : "Guess " + partnerName + "'s Answers ❤️";

      $("instructions").textContent =
        mode === "own"
          ? "Select your true favourites. Your partner cannot see your answers."
          : "Guess your partner's choices. Their answers remain secret until both finish.";

      $("progress").textContent =
        mode === "own"
          ? "Your favourites · 10 questions"
          : "How well do you know " + partnerName + "? · 10 questions";

      questions.forEach((item, i) => {
        const card = document.createElement("div");
        card.className = "question-card";

        const title = document.createElement("h2");
        title.textContent = (i + 1) + ". " + item.q;
        card.appendChild(title);

        item.options.forEach((option, j) => {
          const label = document.createElement("label");
          label.className = "option";

          const radio = document.createElement("input");
          radio.type = "radio";
          radio.name = "q" + i;
          radio.value = String(j);
          radio.checked = Number(selectedAnswers[i]) === j;
          radio.required = j === 0;

          radio.addEventListener("change", () => {
            selectedAnswers[i] = j;
          });

          const text = document.createElement("span");
          text.textContent = option;

          label.appendChild(radio);
          label.appendChild(text);
          card.appendChild(label);
        });

        $("questions").appendChild(card);
      });

      $("gameArea").classList.remove("hidden");
    }

    function startSharedTimer(startAt) {
      if (timerStartedAt === startAt) return;
      timerStartedAt = startAt;

      if (countdownHandle) {
        clearInterval(countdownHandle);
      }

      function update() {
        const remaining = Math.max(
          0,
          Math.ceil((startAt - Date.now()) / 1000)
        );

        $("timer").textContent = remaining > 0
          ? "Starts in " + remaining + "..."
          : "Answer together 💗";

        if (remaining <= 0 && countdownHandle) {
          clearInterval(countdownHandle);
          countdownHandle = null;
        }
      }

      update();
      countdownHandle = setInterval(update, 250);
    }

    function enterGuessMode(level) {
      if (mode === "guess") return;

      mode = "guess";
      selectedAnswers = {};
      submitted = false;

      renderQuestions();
      $("submitBtn").disabled = false;

      showStatus("Both favourites are saved! Guess your partner's answers ❤️");

      if (level && level.startAt) {
        startSharedTimer(level.startAt);
      }
    }

    function displayResults(level) {
      const answers = level.answers || {};
      const guesses = level.guesses || {};

      if (
        !answers.host || !answers.partner ||
        !guesses.host || !guesses.partner
      ) {
        return;
      }

      $("gameArea").classList.add("hidden");
      $("result").classList.remove("hidden");
      $("timer").textContent = "";

      let myCorrect = 0;
      let partnerCorrect = 0;

      for (let i = 0; i < 10; i++) {
        if (
          Number(guesses[role][i]) === Number(answers[partnerRole][i])
        ) {
          myCorrect++;
        }

        if (
          Number(guesses[partnerRole][i]) === Number(answers[role][i])
        ) {
          partnerCorrect++;
        }
      }

      $("scoreText").textContent =
        myName + ": " + myCorrect + "/10 (" +
        (myCorrect * 2.5) + "% of total game)";

      $("resultDetails").textContent =
        partnerName + ": " + partnerCorrect + "/10 (" +
        (partnerCorrect * 2.5) +
        "% of total game). Level 1 maximum contribution: 25%.";

      showStatus("Both players have finished! ❤️");
    }

    function handleRoom(data) {
      roomData = data;

      if (!data || !data.players || !data.players[role]) {
        showStatus("Room/player details not found. Return to Connect Your Partner.");
        return;
      }

      const partner = data.players[partnerRole];
      partnerName = partner && partner.name
        ? partner.name
        : "your partner";

      const level = data.level1 || {};
      const answers = level.answers || {};
      const guesses = level.guesses || {};

      if (!partner) {
        showStatus("Waiting for your partner to connect to room " + roomCode + ".");
        return;
      }

      if (answers.host && answers.partner) {
        if (mode === "own") {
          enterGuessMode(level);
        }

        if (level.startAt) {
          startSharedTimer(level.startAt);
        }

        if (guesses[role]) {
          submitted = true;
          $("submitBtn").disabled = true;
          showStatus("Your guesses are saved. Waiting for your partner...");
        }

        displayResults(level);
      } else {
        showStatus(
          "Partner connected: " + partnerName +
          ". Both of you must submit your favourite answers first."
        );
      }
    }

    $("answerForm").addEventListener("submit", async event => {
      event.preventDefault();

      if (!levelRef || !roomData) return;

      if (Object.keys(selectedAnswers).length !== 10) {
        showStatus("Please answer all 10 questions first.");
        return;
      }

      $("submitBtn").disabled = true;

      try {
        if (mode === "own") {
          // Save this player's answers privately under their own role.
          await levelRef.child("answers/" + role).set(selectedAnswers);

          showStatus("Your favourite answers are saved privately. Waiting for your partner...");

          // Each player checks whether both sets of favourites exist.
          const answerSnapshot = await levelRef.child("answers").once("value");
          const savedAnswers = answerSnapshot.val();

          if (savedAnswers && savedAnswers.host && savedAnswers.partner) {
            // Both clients attempt to set the same shared start time.
            await levelRef.child("startAt").transaction(current =>
              current === null ? Date.now() + 5000 : current
            );
          }
        } else {
          await levelRef.child("guesses/" + role).set(selectedAnswers);

          submitted = true;
          showStatus("Your guesses are saved! Waiting for your partner to finish...");
        }
      } catch (error) {
        console.error("Submit error:", error);
        showStatus("Could not save answers: " + error.message);
        $("submitBtn").disabled = false;
      }
    });

    async function init() {
      if (!roomCode || !role || !["host", "partner"].includes(role)) {
        showStatus("Room details missing. Go back and connect to your partner first.");
        return;
      }

      partnerRole = role === "host" ? "partner" : "host";
      roomRef = db.ref("rooms/" + roomCode);
      levelRef = roomRef.child("level1");

      try {
        if (!auth.currentUser) {
          await auth.signInAnonymously();
        }

        const snapshot = await roomRef.once("value");
        const data = snapshot.val();

        if (!data || !data.players || !data.players[role]) {
          showStatus("Room/player details not found. Connect again.");
          return;
        }

        roomData = data;
        partnerName = data.players[partnerRole]?.name || "your partner";

        // Show questions immediately so the player can start selecting.
        renderQuestions();
        showStatus("Choose your favourite answers and submit ❤️");

        // Listen for the other player's submissions and shared progress.
        roomRef.on("value", snapshot => {
          const updated = snapshot.val();

          if (!updated) {
            showStatus("Room not found. Please connect again.");
            return;
          }

          handleRoom(updated);
        }, error => {
          showStatus("Firebase error: " + error.message);
        });

      } catch (error) {
        console.error("Initialization error:", error);
        showStatus("Firebase error: " + error.message);
      }
    }

    init();
  </script>
</body>
</html>
